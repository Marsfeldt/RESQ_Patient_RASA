version: "3.1"
nlu:
  - intent: start_questionnaire
    examples: |
      - Start the questionnaire
      - Begin the survey
      - I want to start the questionnaire
      - Let's begin the survey
      - I would like to take the questionnaire
  - intent: provide_response
    examples: |
      - I watched Inception
      - I just saw The Matrix
      - I watched Titanic
      - I saw a movie called Avatar
      - I read The Great Gatsby
      - The Bible
      - Stephen King
      - Designated survivor
  - intent: cant_remember
    examples: |
      - I can't remember the last movie I watched
      - I don't remember
      - No idea
      - I can't recall any movie
      - I can't remember the last magazine i read
      - I can't remember the last show I watched
  - intent: affirm
    examples: |
      - yes
      - yep
      - sure
      - absolutely
      - yeah
      - of course
      - definitely
      - that's right
      - correct
      - I agree
  - intent: deny
    examples: |
      - no
      - nope
      - not really
  - intent: every_day
    examples: |
      - every day
      - on a daily basis
      - each day
      - day after day
      - all days
      - I experience this every day

  - intent: several_days
    examples: |
      - several days
      - a few days
      - for a few days
      - some days
      - a couple of days

  - intent: more_than_half_the_days
    examples: |
      - more than half the days
      - most of the days
      - nearly every day
      - almost every day

  - intent: not_at_all
    examples: |
      - not at all
      - never
      - absolutely not
      - no, not at all
  - intent: confused
    examples: |
      - I don't understand
      - Could you explain further?
      - Could you give more details?
      - What?
      - What
      - What does this mean?
      - Explain please
  - intent: provide_number
    examples: |
      - one
      - 1
      - first
      - two
      - 2
      - second
      - three
      - 3
      - third
      - four
      - 4
      - five
      - 5
      - six
      - 6
      - thirteen
      - twenty
      - eighty
      - eighteen
      - seventeen
      - ninety
      - hundred
      - 100
  - intent: skip
    examples: |
      - skip
      - move on
      - go to the next question
  - intent: stop
    examples: |
      - stop
      - end the questionnaire
      - I want to stop
      - I don't want to continue