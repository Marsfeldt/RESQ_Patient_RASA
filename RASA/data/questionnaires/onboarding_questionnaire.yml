name: "Onboarding Questionnaire"
description: "An onboarding questionnaire to familiarise yourself with the system."
questions:
  - id: "q1"
    question_text: "Hi! How are you today?"
    type: "text"
    next: "q2"
  - id: "q2"
    question_text: "Are you ready for some questions?"
    type: "yes_no"
    next:
      affirm: "q3"
      deny: "end"
  - id: "q3"
    question_text: "Before we begin, let's go through some practice questions."
    type: "yes_no"
    next:
      affirm: "q5"
      deny: "q4"
  - id: "q4"
    question_text: "Are you sure? These questions will help you familiarise yourself with how your responses are collected."
    type: "yes_no"
    next:
      affirm: "q5"
      deny: "end"
  - id: "q5"
    question_text: "In the past week, how often did you watch TV? Please choose the closest of these options: not at all, several days, more than half the days, or every day."
    type: "multiple_choice"
    options: [ "not at all", "several days", "more than half the days", "every day" ]
    next:
      not_at_all: "q9"
      provide_frequency: "q6"
      invalid_response: "q6"
  - id: "q6"
    question_text: "What was the last movie or TV show you watched?"
    type: "general_question"
    next:
      provide_response: "q8"
      cant_remember: "q9"
  - id: "q7"
    question_text: "Ok. For the sake of this exercise, you can rate today's weather."
    type: "general_question"
    next: "q8"
  - id: "q8"
    question_text: "How would you rate it on a scale from one to five?"
    type: "number"
    next: "q10"
  - id: "q9"
    question_text: "Ok. For the sake of this exercise, you can think about the last book or magazine you read. What was the last book or magazine you read?"
    type: "general_question"
    next:
      provide_response: "q8"
      cant_remember: "q7"
  - id: "q10"
    question_text: "When watching TV, are you able to control the TV?"
    type: "general_question"
    next: "end"
