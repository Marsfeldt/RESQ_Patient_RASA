version: "3.1"

intents:
  - start_questionnaire
  - provide_response
  - cant_remember
  - affirm
  - deny
  - not_at_all
  - several_days
  - more_than_half_the_days
  - every_day
  - confused
  - provide_number
  - skip
  - stop

actions:
  - action_load_questionnaire
  - action_ask_next_question
  - action_stop_questionnaire

slots:
  current_questionnaire:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  current_question:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  responses:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  attempts:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  total_score:
    type: float
    influence_conversation: false
    initial_value: 0
    mappings:
      - type: custom
  questionnaire_scores:
    type: list
    influence_conversation: false
    mappings:
      - type: custom


entities:
  - text
  - number